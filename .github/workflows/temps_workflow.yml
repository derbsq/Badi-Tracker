name: Update Wassertemperaturen

on:
  schedule:
    - cron: "0 6 * * *"   # 08:00 CH-Zeit (Sommerzeit = UTC+2)
    - cron: "0 10 * * *"  # 12:00 CH-Zeit
    - cron: "0 16 * * *"  # 18:00 CH-Zeit
  workflow_dispatch:

concurrency:
  group: temperatures
  cancel-in-progress: false

jobs:
  temperatures:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Fetch temperatures
        run: python scripts/fetch_temps.py

      - name: Commit
        run: |
          git config user.name "badi-tracker-bot"
          git config user.email "actions@github.com"
          git add data/temperatures.json
          if git diff --staged --quiet; then
            echo "Keine Aenderungen"
          else
            git commit -m "temps: update $(date -u +'%Y-%m-%dT%H:%MZ')"
            # Retry mit force-push auf temperatures.json bei Konflikt
            for i in 1 2 3; do
              git fetch origin main
              git rebase origin/main && git push && break || git rebase --abort
              echo "Retry $i..."
              sleep 3
            done
          fi
